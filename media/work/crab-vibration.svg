<rect x="418" y="255" width="205" height="82" rx="12" fill="#f0eafd"/><text x="520" y="306" text-anchor="middle" font-size="26" font-weight="700" fill="#28213b">PMI = Σ xⱼyⱼ / Σ xⱼ²</text><text x="645" y="282" font-size="17" fill="#30343b">xⱼ: cumulative movement time</text><text x="645" y="312" font-size="17" fill="#30343b">yⱼ: cumulative pause time</text><text x="645" y="338" font-size="17" fill="#30343b">Slope through the origin</text>
