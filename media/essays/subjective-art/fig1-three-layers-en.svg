<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
<rect width="960" height="470" fill="#ffffff"/>
<text x="40" y="48" font-size="22" fill="#1b1b1d">The three-layer paradigm, read through Linnaeus</text>
<rect x="40" y="82" width="820" height="96" rx="6" fill="#f4f2ee" stroke="#c9c6bf"/>
<text x="64" y="122" font-size="20" fill="#1b1b1d" font-weight="600">Classification result</text>
<text x="64" y="152" font-size="17" fill="#1b1b1d">Which branch each species sits on</text>
<text x="836" y="122" font-size="14" fill="#9c5f43" text-anchor="end" font-style="italic">rewritten twice (form → molecules, similarity → ancestry)</text>
<rect x="40" y="202" width="820" height="96" rx="6" fill="#ece9e3" stroke="#c9c6bf"/>
<text x="64" y="242" font-size="20" fill="#1b1b1d" font-weight="600">Classification framework</text>
<text x="64" y="272" font-size="17" fill="#1b1b1d">A nested tree: kingdom → … → species</text>
<text x="836" y="242" font-size="14" fill="#9c5f43" text-anchor="end" font-style="italic">criterion replaced once; the shape survived</text>
<rect x="40" y="322" width="820" height="96" rx="6" fill="#f4f2ee" stroke="#c9c6bf"/>
<text x="64" y="362" font-size="20" fill="#1b1b1d" font-weight="600">Basic assumptions</text>
<text x="64" y="392" font-size="17" fill="#1b1b1d">Some species are more alike; groups can be split again; nesting stays consistent</text>
<text x="836" y="362" font-size="14" fill="#9c5f43" text-anchor="end" font-style="italic">the third one is held up by common descent</text>
<line x1="905" y1="412" x2="905" y2="96" stroke="#6c6a65" stroke-width="1.5"/>
<path d="M898,108 L905,92 L912,108" fill="none" stroke="#6c6a65" stroke-width="1.5"/>
<text x="923" y="252" font-size="14" fill="#6c6a65" transform="rotate(90 923 252)" text-anchor="middle">each layer is built on the one below</text>
</svg>