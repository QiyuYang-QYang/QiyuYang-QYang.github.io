<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, Helvetica Neue, Arial, sans-serif"><rect width="760" height="380" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#8a929c"/></marker></defs><text x="40" y="40" font-size="15" fill="#1f2733" text-anchor="start" font-weight="700" >a</text><text x="58" y="40" font-size="13" fill="#1f2733" text-anchor="start" font-weight="600" >Annotated bouts</text><text x="40" y="82" font-size="11" fill="#8a929c" text-anchor="start" font-weight="600" >control</text><rect x="40" y="90" width="330" height="22" fill="#fff" stroke="#c9ced5"/><rect x="40.0" y="90" width="12.8" height="22" fill="#1f2733"/><rect x="56.1" y="90" width="16.6" height="22" fill="#1f2733"/><rect x="76.7" y="90" width="8.9" height="22" fill="#1f2733"/><rect x="93.3" y="90" width="28.8" height="22" fill="#1f2733"/><rect x="135.8" y="90" width="25.2" height="22" fill="#1f2733"/><rect x="166.0" y="90" width="19.9" height="22" fill="#1f2733"/><rect x="191.8" y="90" width="11.3" height="22" fill="#1f2733"/><rect x="206.4" y="90" width="12.3" height="22" fill="#1f2733"/><rect x="234.3" y="90" width="26.7" height="22" fill="#1f2733"/><rect x="274.8" y="90" width="26.0" height="22" fill="#1f2733"/><rect x="305.4" y="90" width="14.5" height="22" fill="#1f2733"/><rect x="331.1" y="90" width="24.4" height="22" fill="#1f2733"/><text x="40" y="140" font-size="11" fill="#c0563a" text-anchor="start" font-weight="600" >vibration</text><rect x="40" y="148" width="330" height="22" fill="#fff" stroke="#c9ced5"/><rect x="40.0" y="148" width="14.1" height="22" fill="#1f2733"/><rect x="71.1" y="148" width="8.2" height="22" fill="#1f2733"/><rect x="113.5" y="148" width="5.8" height="22" fill="#1f2733"/><rect x="140.8" y="148" width="22.0" height="22" fill="#1f2733"/><rect x="169.6" y="148" width="15.7" height="22" fill="#1f2733"/><rect x="210.8" y="148" width="6.4" height="22" fill="#1f2733"/><rect x="234.5" y="148" width="18.4" height="22" fill="#1f2733"/><rect x="272.7" y="148" width="18.8" height="22" fill="#1f2733"/><rect x="301.1" y="148" width="10.0" height="22" fill="#1f2733"/><rect x="319.0" y="148" width="14.9" height="22" fill="#1f2733"/><rect x="40" y="220" width="14" height="10" fill="#1f2733"/><text x="60" y="229" font-size="11" fill="#5b6573" text-anchor="start" font-weight="400" >moving</text><rect x="130" y="220" width="14" height="10" fill="#fff" stroke="#c9ced5"/><text x="150" y="229" font-size="11" fill="#5b6573" text-anchor="start" font-weight="400" >pausing</text><text x="40" y="260" font-size="11" fill="#5b6573" text-anchor="start" font-weight="400" >Each trial becomes an alternating sequence of</text><text x="40" y="275" font-size="11" fill="#5b6573" text-anchor="start" font-weight="400" >movement and pause durations.</text><line x1="390" y1="140" x2="432" y2="140" stroke="#8a929c" stroke-width="1.6" marker-end="url(#ar)"/><text x="420" y="40" font-size="15" fill="#1f2733" text-anchor="start" font-weight="700" >b</text><text x="438" y="40" font-size="13" fill="#1f2733" text-anchor="start" font-weight="600" >Pause–movement index</text><line x1="450" y1="270" x2="688" y2="270" stroke="#1f2733"/><line x1="450" y1="270" x2="450" y2="64" stroke="#1f2733"/><text x="680" y="288" font-size="11" fill="#5b6573" text-anchor="end" font-weight="400" >cumulative movement</text><text x="438" y="70" font-size="11" fill="#5b6573" text-anchor="end" transform="rotate(-90 438 70)">cumulative pause</text><path d="M450.0,270.0 L459.5,270.0 L459.5,267.6 L471.7,267.6 L471.7,264.6 L478.2,264.6 L478.2,258.9 L499.4,258.9 L499.4,248.8 L518.0,248.8 L518.0,245.0 L532.7,245.0 L532.7,240.7 L541.0,240.7 L541.0,238.2 L550.1,238.2 L550.1,226.8 L569.8,226.8 L569.8,216.6 L589.0,216.6 L589.0,213.2 L599.7,213.2 L599.7,205.0 L617.7,205.0 L617.7,194.3" fill="none" stroke="#8a929c" stroke-width="1.8"/><line x1="450" y1="270" x2="680.0" y2="173.2" stroke="#8a929c" stroke-width="1.2" stroke-dasharray="5 4"/><text x="592.6" y="227.98777820466398" font-size="11" fill="#8a929c" text-anchor="start" font-weight="600" >control</text><path d="M450.0,270.0 L463.4,270.0 L463.4,253.8 L471.2,253.8 L471.2,221.3 L476.7,221.3 L476.7,200.9 L497.5,200.9 L497.5,194.3 L512.5,194.3 L512.5,170.1 L518.6,170.1 L518.6,153.7 L536.1,153.7 L536.1,135.0 L554.0,135.0 L554.0,125.9 L563.5,125.9 L563.5,118.3 L577.6,118.3 L577.6,84.0" fill="none" stroke="#c0563a" stroke-width="1.8"/><line x1="450" y1="270" x2="584.7" y2="70.0" stroke="#c0563a" stroke-width="1.2" stroke-dasharray="5 4"/><text x="576.7335673724608" y="76.0" font-size="11" fill="#c0563a" text-anchor="end" font-weight="600" >vibration</text><text x="450" y="320" font-size="14" fill="#1f2733" text-anchor="start" font-weight="400" font-style="italic">PMI = Σ xⱼyⱼ / Σ xⱼ²</text><text x="450" y="340" font-size="11" fill="#5b6573" text-anchor="start" font-weight="400" >slope of a line through the origin;</text><text x="450" y="355" font-size="11" fill="#5b6573" text-anchor="start" font-weight="400" >steeper = more pausing per unit of movement</text></svg>