<text x="40" y="258">brain bleed (spontaneous intracerebral hemorrhage). A <tspan font-weight="600" fill="#1f2937">schema-driven</tspan></text>
<text x="40" y="276"><tspan font-weight="600" fill="#1f2937">harness</tspan> writes each tool's contract into the prompt and checks every</text>
<text x="40" y="294">result against it; the LLM weighs the evidence and reports <tspan font-weight="600" fill="#1f2937">how</tspan></text>
<text x="40" y="312"><tspan font-weight="600" fill="#1f2937">uncertain</tspan> the outcome is.</text>
</g>
