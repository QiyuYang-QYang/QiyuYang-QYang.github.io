<!-- title -->
<text class="title" x="150" y="96">SICH-Copilot</text>
<text class="sub" x="150" y="131">An LLM agent that predicts how well a patient will recover after a brain bleed (spontaneous intracerebral hemorrhage).</text>
<text class="sub" x="150" y="150">A <tspan font-weight="600" fill="#1f2937">schema-driven harness</tspan> writes each tool's contract into the prompt and checks every result against it;</text>
<text class="sub" x="150" y="169">the LLM weighs the evidence and reports <tspan font-weight="600" fill="#1f2937">how uncertain</tspan> the outcome is.</text>
